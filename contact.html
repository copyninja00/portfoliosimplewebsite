    <div class="contact-form">
    <form>
        <table>
            <tr>
                <td>
                    <label>Name: </label>
                </td>
                <td>
                    <input type="text" placeholder="Enter your name" class="contact-form__input">
                </td>
            </tr>
            <tr>
                <td>
                    <label>Email: </label>
                </td>
                <td>
                    <input type="email" placeholder="Enter your email" class="contact-form__input">
                </td>
            <tr>
                <td>
                    <label>Message: </label>
                </td>
                <td>
                    <textarea rows="4" cols="50" placeholder="Enter your message" class="contact-form__textarea"></textarea>
            </tr>
            <tr>
                <td>
                    <label>submit</label>
                </td>
                <td>
                    <input type="submit" class="contact-form__submit">
                </td>
            </tr>
        </table>
    </form>
